name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # CI only reads the repository

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate plugin manifests and launcher
        run: |
          python - <<'PY'
          import json, pathlib
          for f in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "hooks/hooks.json"):
              json.loads(pathlib.Path(f).read_text())
          PY
          test -x bin/sdd
          bash -n bin/sdd

  graphify-lock:
    # The exact-version lock must install on every OS, or automatic graph builds break.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Install the pinned graphify with its lock
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, '.'); from specsteward.config import GRAPHIFY_VERSION; print(GRAPHIFY_VERSION)")
          uv tool install "graphifyy==$version" -c specsteward/graphify-constraints.txt
          # uv's tool folder is not on PATH on every runner (Windows); specsteward looks there too.
          "$(uv tool dir --bin)/graphify" --help >/dev/null

  e2e:
    # The full scripted flow on a copy of the example: init, trust, doctor, analyze,
    # approve --start, next, brief, RED/GREEN gate, review, done, converge, views.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: End-to-end run of the example
        shell: bash
        run: bash scripts/e2e.sh
